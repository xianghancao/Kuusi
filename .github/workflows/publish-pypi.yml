# Publish jupyterlab-kuusi to PyPI on version tags.
#
# One-time setup on https://pypi.org:
#   1. Log in → Publishing → Add a new pending publisher (or project → Collaborators)
#   2. PyPI project name: jupyterlab-kuusi
#   3. Owner: xianghancao
#   4. Repository name: kuusi   (must match GitHub exactly)
#   5. Workflow name: publish-pypi.yml
#   6. Environment name: pypi
#
# Then create a matching GitHub Environment named "pypi" (Settings → Environments).
# Optional: add a protection rule requiring approval before publish.
#
# Release flow:
#   bump versions → write the CHANGELOG entry (## [X.Y.Z] - date) → commit →
#   git tag vX.Y.Z → git push origin vX.Y.Z
#
# After PyPI accepts the files, the `release` job creates the GitHub Release for
# the tag, with the notes taken from that CHANGELOG entry.

name: Publish PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    env:
      # jupyter labextension build uses jlpm; CI immutable mode fails when
      # the npm-managed monorepo yarn.lock is slightly out of date.
      YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade pip
          python -m pip install build jupyterlab

      - name: Version sync check
        run: npm run check:versions

      - name: Production labextension
        run: npm run build:release

      - name: Build sdist and wheel
        working-directory: packages/jupyterlab-kuusi
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: packages/jupyterlab-kuusi/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jupyterlab-kuusi/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub Release
    # Only for version tags (a manual run has no tag to release).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## ${VERSION}"
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              /^## \[/ { if (found) exit }
              found
            ' CHANGELOG.md
          } > release-notes.md
          # A tag without a CHANGELOG entry still gets a Release, pointing at the file.
          if [ "$(wc -l < release-notes.md)" -le 1 ]; then
            echo "" >> release-notes.md
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." >> release-notes.md
          fi
          cat release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as is."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Kuusi ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
